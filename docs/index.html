<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="google-site-verification" content="UoXRZQYOmfH9LrIXUykFFNflzssDYaNNAzNQlo8grKQ">
		<meta name="msvalidate.01" content="C348576BB92261CC55029F04F308DB94">

		<title>Newsy</title>

		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/Primer/21.2.2/primer.css"
		>
	</head>

	<body>
		<main class="container-md p-3 p-md-6">
			<nav
				class="d-flex flex-justify-between flex-items-center mb-3 pb-2 border-bottom"
			>
				<a
					href="/"
					class="f4 text-bold no-underline color-fg-default"
				>
					📰 Newsy
				</a>

				<a
					href="https://github.com/Pratyay360/newsy"
					class="btn btn-sm btn-primary"
				>
					GitHub
				</a>
			</nav>

			<h1 class="h2 mb-2">Newsy</h1>

			<p class="mb-4">
				<a
					href="https://github.com/apps/newsletter-newsy/installations/select_target"
					class="btn btn-primary"
				>
					Install App
				</a>
			</p>

			<form id="repo-form">
				<div class="mb-3">
					<label for="repository" class="d-block text-bold mb-1">
						GitHub Repository
					</label>

					<input
						id="repository"
						name="repository"
						type="text"
						class="form-control"
						placeholder="owner/repository"
						autocomplete="off"
						required
					>
				</div>

				<div class="mb-3">
					<label for="search-label" class="d-block text-bold mb-1">
						Issue Label to Search
					</label>

					<input
						id="search-label"
						type="text"
						value="newsletter"
						class="form-control"
						placeholder="e.g. newsletter, updates"
					>
				</div>

				<div class="Box mb-3">
					<div class="Box-header">
						<h2 class="Box-title f5 text-bold">
							Button customizer
						</h2>
					</div>

					<div class="Box-body">
						<div class="mb-3">
							<label for="custom-btn-text" class="d-block text-bold mb-1">
								Button Label
							</label>

							<input
								id="custom-btn-text"
								type="text"
								value="Subscribe on GitHub"
								class="form-control"
							>
						</div>

						<div class="d-flex flex-column flex-md-row gap-3">
							<div class="flex-auto">
								<label for="btn-style" class="d-block text-bold mb-1">
									Theme Variant
								</label>

								<select id="btn-style" class="form-select width-full">
									<option value="primer-primary">Primer Blue</option>
									<option value="primer-dark">GitHub Dark</option>
									<option value="primer-green">Primer Green</option>
									<option value="purple-glow">Purple Neon</option>
									<option value="minimal">Minimal Outline</option>
								</select>
							</div>

							<div class="flex-auto">
								<label for="btn-size" class="d-block text-bold mb-1">
									Button Size
								</label>

								<select id="btn-size" class="form-select width-full">
									<option value="sm">Small</option>
									<option value="md" selected>Medium</option>
									<option value="lg">Large</option>
								</select>
							</div>
						</div>
					</div>
				</div>

				<button
					type="submit"
					class="btn btn-primary width-full"
					id="submit-button"
				>
					Generate iframe
				</button>
			</form>

			<div id="status-flash" class="mt-3" hidden>
				<div id="status" class="flash" aria-live="polite"></div>
			</div>

			<div
				id="result"
				class="Box mt-3"
				hidden
				aria-live="polite"
			>
				<div class="Box-header">
					<h2 class="Box-title f5 text-bold">
						Preview &amp; Snippet
					</h2>
				</div>

				<div class="Box-body">
					<p id="issue-info" class="mb-2 f5 text-bold"></p>

					<iframe
						id="subscribe-iframe"
						class="width-full border rounded-2"
						height="160"
						title="Subscription preview"
					></iframe>
				</div>

				<div class="Box-footer">
					<label
						for="button-code"
						class="d-block mb-1 text-bold f6"
					>
						Embed code
					</label>

					<textarea
						id="button-code"
						class="form-control input-monospace width-full"
						readonly
						rows="3"
					></textarea>

					<div class="mt-2">
						<button
							id="copy-button"
							type="button"
							class="btn btn-sm btn-secondary"
						>
							Copy to clipboard
						</button>
					</div>
				</div>
			</div>
		</main>

		<script src="script.js"></script>
	</body>
</html>
